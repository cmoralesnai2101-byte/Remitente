<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remitente 🌸🪷 - Cartas de Amor</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;1,400&family=Parisienne&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #FDFBF7;
            --pink-blossom: #F4C2C2;
            --sage-mint: #B2AC88;
            --ivory: #FFFFF0;
            --warm-gold: #D4AF37;
            --text-color: #3B2F2F;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            font-family: 'Playfair Display', serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-family: 'Parisienne', cursive;
            font-size: 2.8rem;
            color: #8B4513;
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid var(--pink-blossom);
        }

        .editor-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #666;
            display: block;
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #DCDCDC;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        /* VISTA DE CARTA */
        .letter-paper {
            background-color: var(--ivory);
            border: 2px solid var(--sage-mint);
            padding: 40px;
            border-radius: 4px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.15);
            margin-bottom: 20px;
            min-height: 380px;
        }

        .letter-content {
            font-family: 'Dancing Script', cursive;
            font-size: 1.4rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--pink-blossom);
            color: #4A3B32;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #E8B4B4;
            transform: translateY(-1px);
        }

        /* MODO RECEPTOR / SOBRE */
        #envelope-view {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .wax-seal {
            width: 80px;
            height: 80px;
            background: #8B0000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFD700;
            font-size: 2rem;
            margin: 20px auto;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 3px solid #B8860B;
            transition: transform 0.3s ease;
        }

        .wax-seal:hover {
            transform: scale(1.1);
        }

        .rating-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #ccc;
        }

        .stars {
            font-size: 2rem;
            color: #FFD700;
            cursor: pointer;
        }

        .star {
            opacity: 0.3;
            transition: opacity 0.2s;
        }

        .star.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Remitente 🌸🪷</h1>
        <p style="font-size: 0.9rem; color: #777;">Cartas Románticas Art Nouveau</p>
    </div>

    <!-- MODO CREADOR -->
    <div id="creator-view" class="app-container">
        <div class="editor-controls">
            <div>
                <label>De (Remitente):</label>
                <input type="text" id="fromInput" value="Nai 💖" oninput="updateLetter()">
            </div>
            <div>
                <label>Para (Destinatario):</label>
                <input type="text" id="toInput" value="Mi Niño 🧸" oninput="updateLetter()">
            </div>
        </div>

        <div style="margin-bottom: 15px;">
            <label>Mensaje de la carta:</label>
            <textarea id="bodyInput" oninput="updateLetter()">Hoy comienza un nuevo mes y no pude evitar pensar en ti. Gracias por existir en mi vida. Te amo muchísimo. 🌸</textarea>
        </div>

        <div class="letter-paper" id="letterPaper">
            <div style="font-weight: bold; margin-bottom: 15px;" id="dispTo">Para: Mi Niño 🧸</div>
            <div class="letter-content" id="dispBody">Hoy comienza un nuevo mes...</div>
            <div style="text-align: right; margin-top: 25px; font-weight: bold;" id="dispFrom">De: Nai 💖</div>
        </div>

        <div class="actions">
            <button onclick="generateShortLink()">🔗 Copiar Enlace Único</button>
            <button onclick="downloadImage()" style="background-color: var(--sage-mint); color: #fff;">📸 Descargar Imagen</button>
        </div>
    </div>

    <!-- MODO RECEPTOR (SOBRE INTERACTIVO) -->
    <div id="envelope-view" class="app-container">
        <div id="seal-screen">
            <h2 style="font-family: 'Parisienne', cursive; font-size: 2.2rem;">Tienes una carta especial 💌</h2>
            <p>Haz clic en el sello de cera para abrirla</p>
            <div class="wax-seal" onclick="openLetter()">🌸</div>
        </div>

        <div id="opened-letter" style="display: none;">
            <div class="letter-paper">
                <div style="font-weight: bold; margin-bottom: 15px;" id="recvTo"></div>
                <div class="letter-content" id="recvBody"></div>
                <div style="text-align: right; margin-top: 25px; font-weight: bold;" id="recvFrom"></div>
            </div>

            <div class="rating-section">
                <h3>¿Qué te pareció la carta? ✨</h3>
                <div class="stars" id="starRating">
                    <span class="star" onclick="setRating(1)">★</span>
                    <span class="star" onclick="setRating(2)">★</span>
                    <span class="star" onclick="setRating(3)">★</span>
                    <span class="star" onclick="setRating(4)">★</span>
                    <span class="star" onclick="setRating(5)">★</span>
                </div>
                <textarea id="reviewText" placeholder="Escríbele una respuesta o reacción..." style="margin-top: 10px;"></textarea>
                <button onclick="sendReview()" style="margin-top: 10px; width: 100%;">Enviar Respuesta 💌</button>
            </div>
        </div>
    </div>

    <script>
        function updateLetter() {
            document.getElementById('dispTo').innerText = "Para: " + document.getElementById('toInput').value;
            document.getElementById('dispFrom').innerText = "De: " + document.getElementById('fromInput').value;
            document.getElementById('dispBody').innerText = document.getElementById('bodyInput').value;
        }

        // COMPRESIÓN ULTRA CORTO DE URL
        function generateShortLink() {
            const data = {
                f: document.getElementById('fromInput').value,
                t: document.getElementById('toInput').value,
                b: document.getElementById('bodyInput').value
            };
            
            // Codificación limpia y corta de parámetros
            const encoded = encodeURIComponent(JSON.stringify(data));
            const fullUrl = window.location.origin + window.location.pathname + '?c=' + encoded;
            
            navigator.clipboard.writeText(fullUrl).then(() => {
                alert("¡Enlace corto copiado al portapapeles! 🌸\nAhora puedes pegarlo en WhatsApp.");
            });
        }

        // CARGA DE MODO RECEPTOR
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const letterData = urlParams.get('c');

            if (letterData) {
                try {
                    const parsed = JSON.parse(decodeURIComponent(letterData));
                    document.getElementById('creator-view').style.display = 'none';
                    document.getElementById('envelope-view').style.display = 'block';

                    document.getElementById('recvTo').innerText = "Para: " + parsed.t;
                    document.getElementById('recvFrom').innerText = "De: " + parsed.f;
                    document.getElementById('recvBody').innerText = parsed.b;
                } catch(e) {
                    console.error("Error al decodificar la carta", e);
                }
            }
        };

        function openLetter() {
            document.getElementById('seal-screen').style.display = 'none';
            document.getElementById('opened-letter').style.display = 'block';
        }

        function setRating(stars) {
            const starElements = document.querySelectorAll('.star');
            starElements.forEach((s, idx) => {
                if (idx < stars) s.classList.add('active');
                else s.classList.remove('active');
            });
        }

        function sendReview() {
            alert("¡Tu respuesta ha sido guardada! 💕");
        }

        function downloadImage() {
            html2canvas(document.getElementById('letterPaper'), { scale: 3 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'carta-remitente.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
